[project]
name = "robot-umi"
version = "0.1.0"
description = "Robot UMI data-collection stack: Raspberry Pi recorder, shared core, and GPU SLAM ingest server"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["common/robot-umi-core", "device", "server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
