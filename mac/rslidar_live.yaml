common:
  msg_source: 1
  send_packet_ros: false
  send_point_cloud_ros: true
lidar:
  - driver:
      lidar_type: RSAIRY
      msop_port: 6699
      difop_port: 7788
      imu_port: 6688
      start_angle: 0
      end_angle: 360
      min_distance: 0.1
      max_distance: 60.0
      # false = stamp points with the HOST clock on arrival (not the lidar's own clock).
      # Live GLIM needs points + IMU on a common clock; the Airy's PTP can lag the host by
      # minutes, which desyncs them and stalls the online estimator. Host-clock stamping is
      # robust to that drift (the offline path realigns via the pcap instead).
      use_lidar_clock: false
      dense_points: true
      ts_first_point: true
    ros:
      ros_frame_id: rslidar
      ros_send_point_cloud_topic: /rslidar_points
      ros_send_imu_data_topic: /rslidar_imu_data
      ros_queue_length: 100
