# Rig config: ONE UMI. Copy to config/umi.yaml (gitignored) and point
# $ROBOT_UMI_CONFIG at it. N = number of entries under `umis` — that is the whole
# 1-vs-2-UMI switch (state dim = 6 * N, derived in robot_umi_core.config.derive).
#
# The device snapshots this file + every referenced calib blob into each episode
# (config_snapshot/); server stages read ONLY that snapshot. Deployment knobs
# (dataset repo_id, HF push, tokens) live in server env/compose — not here.
version: 1

# Boot-default record mode; the MODE button cycles lidar -> vive -> lidar+vive at
# runtime (idle only). The episode manifest records the mode actually used.
motion_source: "lidar"

task: "umi demo task"

# HMI wiring for THIS Pi (one button set + one status LCD, independent of UMI count).
# Omit the block or any key to keep the historical defaults (record=17 quit=27 mode=22,
# LCD dc=25 rst=4 bl=18). Pins are BCM GPIO; all pins must be distinct (validated).
controls:
  buttons: { record: 12, quit: 16, mode: 22 }
  display: { kind: lcd, dc: 25, rst: 27, bl: 18 }  # kind: none if this rig has no LCD

umis:
  umi1:
    camera:
      # by-path device pin survives USB re-enumeration
      device: "/dev/v4l/by-path/platform-xhci-hcd.0-usb-0:1:1.0-video-index0"
      width: 800      # MUST stay 4:3 when a gripper is configured — the ArUco tags
      height: 600     # ride the bottom band; 16:9 clips them (validated at load)
      fps: 30
      exposure: 100
      calib: "config/calib/umi1_calib.npz"   # fisheye K/dist/image_size/model
    lidar:
      type: "auto"            # auto | robosense | livox (capture is type-agnostic pcap)
      iface: "eth0"
      host_ip: "192.168.1.102"
      lidar_ip: "192.168.1.200"
    # vive: omitted — lidar-only rig. Add serial + ee_calib to enable vive modes.
    gripper:
      tag_ids: [0, 1]         # DICT_4X4_50 pair for this arm
      stride: 2               # detect every Nth frame (server-side)
      roi_top_frac: 0.0
