[project]
name = "dataset-filtering-tests"
version = "0.1.0"
description = "Isolated R&D harness for UMI-to-YAM dataset filtering experiments"
requires-python = ">=3.12"
dependencies = [
    "umi-dataset-filtering",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
filter-rd = "dataset_filtering_tests.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_filtering_tests"]

[tool.uv.sources]
umi-dataset-filtering = { path = "../dataset-filtering", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
