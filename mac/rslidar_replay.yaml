common:
  msg_source: 3            # 3 = replay packets from a pcap (vs 1 = live UDP)
  send_packet_ros: false
  send_point_cloud_ros: true
lidar:
  - driver:
      lidar_type: RSAIRY
      msop_port: 6699
      difop_port: 7788
      imu_port: 6688
      pcap_path: "@PCAP@"    # substituted per-episode by entrypoint.sh (replay mode)
      pcap_repeat: false     # replay the pcap once, then rslidar_sdk exits (clean EOF)
      start_angle: 0
      end_angle: 360
      min_distance: 0.1
      max_distance: 60.0
      use_lidar_clock: true  # stamps come from the PTP-disciplined lidar payload, not
      dense_points: true     # the replay wall clock — same as live decode
      ts_first_point: true
    ros:
      ros_frame_id: rslidar
      ros_send_point_cloud_topic: /rslidar_points
      ros_send_imu_data_topic: /rslidar_imu_data
      ros_queue_length: 100
