[project]
name = "umi-live-device"
version = "0.1.0"
description = "Raspberry Pi recorder and uploader for UMI-Live episodes"
requires-python = ">=3.12"
dependencies = [
    # Floor kept at 2.2 so the workspace can co-resolve with lerobot's
    # numpy<2.3 pin; the device only uses stable numpy core APIs.
    "numpy>=2.2.6",
    "opencv-python-headless>=4.9.0",
    "pillow>=10.0",
    "umi-live-core",
    "tyro>=1.0.15",
]

[project.optional-dependencies]
# Pi-only hardware extras. lgpio is the pin-factory backend gpiozero needs on a
# Pi 5 (the legacy RPi.GPIO backend has no Pi-5 support); without it the GPIO
# buttons raise at import. spidev drives the ST7789 LCD panel.
pi = [
    "gpiozero>=2.0",
    "lgpio>=0.2.2.0",
    "spidev>=3.6",
]

[tool.uv.sources]
umi-live-core = { workspace = true }
umi-live-test-support = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "ty>=0.0.57",
    "umi-live-test-support",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
