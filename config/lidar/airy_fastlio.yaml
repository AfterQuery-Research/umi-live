/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3            # downsample (Airy pushes ~86k pts/frame; ease Pi CPU)
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/rslidar_points"
            imu_topic:  "/rslidar_imu_data"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 5                # 5 = ROBOSENSE (handler added to preprocess)
            scan_line:  96               # Airy has 96 beams
            blind: 0.5
            timestamp_unit: 0            # unused by robosense_handler (it emits ms directly)
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     60.0          # Airy max range
            extrinsic_est_en:  true      # online-estimate IMU<-LiDAR extrinsic (starts identity)
            extrinsic_T: [ 0.0, 0.0, 0.0 ]   # IMU is co-located in the Airy body
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en:  true
            dense_publish_en: false
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: false
            interval: -1
