# gPTP-style PTP master profile for lidars — VALIDATED ON HARDWARE (RoboSense
# Airy, 2026-07-15): the Airy sends pdelay to 01:80:c2:00:00:0e with
# transportSpecific 1 (802.1AS-style); with this profile it adopts the Pi as
# grandmaster and steps its packet timestamps onto Pi CLOCK_REALTIME.
#
# utc_offset 0 is load-bearing: gPTP distributes the PTP (TAI) timescale, and
# without it the lidar subtracts the standard 37 s TAI-UTC offset — putting
# every per-point timestamp 37 s off the camera axis.
[global]
transportSpecific 0x1
network_transport L2
delay_mechanism P2P
serverOnly 1
logSyncInterval -3
logAnnounceInterval 0
step_threshold 1
utc_offset 0
