<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Combined UMI filtering progress</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f3ef;
        --panel: #ffffff;
        --ink: #191a17;
        --muted: #656861;
        --line: #dadbd5;
        --good: #277b59;
        --dense: #4267a9;
        --bad: #b34f42;
        --track: #e3e3dc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151613;
          --panel: #1d1f1b;
          --ink: #f2f1ec;
          --muted: #aaaDA5;
          --line: #3b3e37;
          --good: #65ba8f;
          --dense: #7f9bd1;
          --bad: #df8174;
          --track: #31342e;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(1040px, calc(100% - 32px)); margin: 40px auto; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 20px; }
      h1 { margin: 0; font-size: clamp(24px, 4vw, 38px); font-weight: 500; letter-spacing: -0.03em; }
      .live { display: flex; align-items: center; gap: 8px; color: var(--muted); white-space: nowrap; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--good); }
      .progress-wrap { margin: 28px 0 22px; }
      .progress-meta { display: flex; justify-content: space-between; margin-bottom: 9px; color: var(--muted); }
      .progress { height: 14px; border-radius: 999px; overflow: hidden; background: var(--track); }
      .progress > div { height: 100%; width: 0; background: var(--good); transition: width 400ms ease; }
      .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
      .label { min-height: 38px; color: var(--muted); }
      .value { margin-top: 10px; font-size: clamp(30px, 5vw, 48px); font-variant-numeric: tabular-nums; letter-spacing: -0.04em; }
      .card[data-kind="dense"] .value { color: var(--dense); }
      .card[data-kind="failed"] .value { color: var(--bad); }
      .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 18px; color: var(--muted); }
      @media (max-width: 760px) {
        main { margin: 24px auto; }
        header { align-items: start; flex-direction: column; }
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .card:first-child { grid-column: 1 / -1; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Combined filtering run</h1>
        <div class="live"><span class="dot" aria-hidden="true"></span><span id="live-label">Updating…</span></div>
      </header>
      <section class="progress-wrap" aria-label="Overall progress">
        <div class="progress-meta"><span id="progress-label">0 of 298 complete</span><span id="percent">0%</span></div>
        <div class="progress"><div id="progress-bar"></div></div>
      </section>
      <section class="grid" aria-label="Filtering result counts">
        <article class="card"><div class="label">Completed</div><div class="value" id="completed">0</div></article>
        <article class="card"><div class="label">Passed (total)</div><div class="value" id="passed">0</div></article>
        <article class="card" data-kind="dense"><div class="label">Passed with dense (subset)</div><div class="value" id="passed-dense">0</div></article>
        <article class="card" data-kind="dense"><div class="label">Failed after dense (subset)</div><div class="value" id="failed-dense">0</div></article>
        <article class="card" data-kind="failed"><div class="label">Failed (total)</div><div class="value" id="failed">0</div></article>
      </section>
      <div class="foot">
        <span id="remaining">298 remaining</span>
        <span id="detail">No completed episode yet</span>
      </div>
    </main>
    <script>
      const ids = {
        completed: document.getElementById("completed"),
        passed: document.getElementById("passed"),
        passedDense: document.getElementById("passed-dense"),
        failedDense: document.getElementById("failed-dense"),
        failed: document.getElementById("failed"),
      };
      async function refresh() {
        try {
          const response = await fetch("/api/status", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const status = await response.json();
          const percentage = status.total ? (100 * status.completed / status.total) : 0;
          ids.completed.textContent = status.completed;
          ids.passed.textContent = status.passed;
          ids.passedDense.textContent = status.passed_with_dense;
          ids.failedDense.textContent = status.failed_with_dense;
          ids.failed.textContent = status.failed;
          document.getElementById("progress-label").textContent = `${status.completed} of ${status.total} complete`;
          document.getElementById("percent").textContent = `${percentage.toFixed(1)}%`;
          document.getElementById("progress-bar").style.width = `${percentage}%`;
          document.getElementById("remaining").textContent = `${status.remaining} remaining`;
          document.getElementById("detail").textContent = status.latest_combined_input === null
            ? "No completed episode yet"
            : `Latest completed combined input: ${status.latest_combined_input}`;
          document.getElementById("live-label").textContent = `Live · ${new Date().toLocaleTimeString()}`;
        } catch (error) {
          document.getElementById("live-label").textContent = "Waiting for status endpoint";
        }
      }
      refresh();
      setInterval(refresh, 2000);
    </script>
  </body>
</html>
