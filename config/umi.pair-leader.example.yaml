# Rig config: the LEADER Pi of a two-Pi bimanual pair (records the LEFT arm as umi1).
#
# Two-Pi topology: each Pi has ONE lidar + camera on its own built-in eth0 (no 2nd NIC,
# no factory-IP reprovision — both lidars keep 192.168.1.200 because they're on separate
# machines). The leader has the buttons; one press starts/stops BOTH Pis. Each Pi records
# a single-UMI episode tagged with a shared session_id; the server merges the pair into
# one 12-D bimanual dataset (see server pair_stage). The follower config is umi.pair-
# follower.example.yaml — it MUST name its UMI "umi2" with disjoint gripper tags.
#
# Coordination is set in the Pi's .env (rendered by bin/provision-pair), not here:
#   ROBOT_UMI_ROLE=leader   ROBOT_UMI_PEER=<follower-ip>:9140   ROBOT_UMI_TIME_REF=<ntp-ip>
version: 1

motion_source: "lidar"

task: "bimanual umi demo"

# HMI wiring: the LEADER owns the buttons + LCD.
controls:
  buttons: { record: 12, quit: 16, mode: 22 }
  display: { kind: lcd, dc: 25, rst: 27, bl: 18 }

umis:
  umi1:                       # LEFT arm; dataset state slots 0-5, timeline master
    camera:
      device: "/dev/v4l/by-path/platform-xhci-hcd.0-usb-0:1:1.0-video-index0"
      width: 800
      height: 600
      fps: 30
      exposure: 100
      calib: "config/calib/umi1_calib.npz"
    lidar:
      type: "auto"
      iface: "eth0"
      host_ip: "192.168.1.102"
      lidar_ip: "192.168.1.200"
      # t_lidar_imu: [x, y, z, qx, qy, qz, qw]   # optional; else auto-read from DIFOP
    gripper:
      tag_ids: [0, 1]         # this arm's ArUco pair — MUST be disjoint from umi2's
      stride: 2
