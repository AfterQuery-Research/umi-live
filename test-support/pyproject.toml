description = "Synthetic sensor fixtures used only by the UMI Flow test suites"
requires-python = ">=3.12"
dependencies = [
    "umi-flow-core",
]

[tool.uv.sources]
umi-flow-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
