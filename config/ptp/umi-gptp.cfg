# gPTP-style PTP master profile for lidars — VALIDATED ON HARDWARE (RoboSense
# Airy): the sensor listens for 802.1AS traffic on 01:80:c2:00:00:0e. Linuxptp's
# default PTP destination is 01:1b:19:00:00:00, so ptp_dst_mac is load-bearing:
# without it the Pi becomes grandmaster but the Airy remains explicitly UnLock.
#
# utc_offset 0 is load-bearing: gPTP distributes the PTP (TAI) timescale, and
# without it the lidar subtracts the standard 37 s TAI-UTC offset — putting
# every per-point timestamp 37 s off the camera axis.
[global]
transportSpecific 0x1
network_transport L2
delay_mechanism P2P
ptp_dst_mac 01:80:C2:00:00:0E
serverOnly 1
logSyncInterval -3
logAnnounceInterval 0
step_threshold 1
utc_offset 0
